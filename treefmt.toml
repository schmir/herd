[global]
excludes = ["LICENSE"]

[formatter.janet]
command = "janet-format"
includes = ["*.janet", "*.jdn"]

[formatter.just]
command = "sh"
options = ["-c", 'for f in "$@"; do just --fmt --justfile "$f"; done', "--"]
includes = ["justfile", ".justfile", "*.just"]

[formatter.prettier]
command = "prettier"
options = ["--write"]
includes = ["*.md"]

[formatter.ruff-check]
command = "uv"
options = ["run", "ruff", "check", "--fix"]
includes = ["*.py"]
priority = 1

[formatter.ruff-format]
command = "uv"
options = ["run", "ruff", "format"]
includes = ["*.py"]
priority = 2

[formatter.nixfmt]
command = "nixfmt"
includes = ["*.nix"]

[formatter.shfmt]
command = "shfmt"
options = ["-w", "-i", "4"]
includes = ["*.sh", "*.bash"]
