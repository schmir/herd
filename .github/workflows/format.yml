name: format

on:
  push:
  # A pull request from a fork is not a push to this repository.
  pull_request:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      # The fmt shell rather than the default one, whose editor tooling is
      # built from source. Fetch its packages in a step of their own, so that
      # the nix output stays out of the log of the check.
      - name: Set up the fmt shell
        run: nix develop .#fmt --command true
      - name: Check formatting
        run: |
          nix develop .#fmt --command treefmt
          git diff --exit-code
