name: format

on:
  push:
  # A pull request from a fork is not a push to this repository.
  pull_request:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Check formatting
        run: |
          nix develop --command treefmt
          git diff --exit-code
