name: release

on:
  push:
    tags: ["v*"]
  # Runs the builds and uploads artifacts, but publishes no release.
  workflow_dispatch:

permissions:
  contents: read

env:
  # A tag build bakes its own tag into the binary. Anything else is not a
  # release, and says so when asked for its version.
  HERD_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}

jobs:
  linux:
    name: linux-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    steps:
      - uses: actions/checkout@v4

      # The build happens in a container build rather than in a `container:`
      # job on purpose: GitHub injects its own glibc-linked node to run actions
      # like checkout, and that node cannot execute inside an Alpine container.
      #
      # `--output` needs BuildKit, which docker uses by default here; the
      # variable makes that independent of the runner image's configuration.
      # Runners start with an empty layer cache, so unlike a local `just
      # build-musl` this rebuilds the toolchain every time.
      - name: Build static binary
        env:
          DOCKER_BUILDKIT: "1"
        run: |
          docker build --build-arg HERD_VERSION \
            --output type=local,dest=build-musl .

      - name: Check the binary is static and runs
        run: |
          file build-musl/herd
          file build-musl/herd | grep -q 'statically linked'
          # The runner is glibc; an Alpine-built binary running here is the
          # portability claim under test. Asking for the version also proves
          # the build baked one in.
          test "$(./build-musl/herd --version)" = "herd $HERD_VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: herd-linux-${{ matrix.arch }}
          path: build-musl/herd
          if-no-files-found: error

  macos:
    name: macos-arm64
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build binary
        run: ./.github/scripts/build-macos.sh

      - name: Check the binary runs
        run: |
          file build/herd
          test "$(./build/herd --version)" = "herd $HERD_VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: herd-macos-arm64
          path: build/herd
          if-no-files-found: error

  release:
    needs: [linux, macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Every job uploads a file named `herd`; rename each one after the
      # artifact directory it came from so the assets are distinguishable.
      - name: Collect assets
        run: |
          mkdir dist
          for dir in artifacts/*/; do
            cp "$dir/herd" "dist/$(basename "$dir")"
          done
          chmod +x dist/*
          (cd dist && sha256sum * > SHA256SUMS)
          ls -l dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes dist/*
