name: release

on:
  push:
    tags: ["v*"]
  # Runs the builds and uploads artifacts, but publishes no release.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Builds the binaries on one machine and runs each on the platform it is
  # for, so publishing waits on the same checks every push runs. The BSD
  # binaries are the exception: GitHub has no runners for them, so they are
  # published without having run.
  test:
    uses: ./.github/workflows/test.yml

  # Waits for PyPI: a version there cannot be replaced, so the GitHub release
  # follows only once the wheels are published. A tag that is not a
  # normalized PEP 440 version stops the pypi job, and so both.
  release:
    needs: [test, pypi]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      # For the pre-release check below, with the packaging that uv.lock pins.
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      # The binaries the test workflow built and checked, as PLATFORM/herd.
      - uses: actions/download-artifact@v8
        with:
          name: binaries
          path: artifacts

      # All binaries have the name `herd`. Use the directory name to identify
      # the platform. The archive name includes the release tag and the
      # platform. The file in the archive keeps the name `herd`.
      - name: Collect assets
        run: |
          mkdir dist stage
          for dir in artifacts/*/; do
            platform="$(basename "$dir")"
            install -m 755 "$dir/herd" stage/herd
            # Set the owner and group IDs to 0. This prevents the archive from
            # containing runner account information.
            tar -czf "dist/herd-${GITHUB_REF_NAME}-${platform}.tar.gz" \
              --owner=0 --group=0 --numeric-owner -C stage herd
          done
          rm -rf stage
          # Include the tag in the checksum file name. This gives each release
          # a different checksum file name.
          (cd dist && sha256sum -- *.tar.gz > "herd-${GITHUB_REF_NAME}-SHA256SUMS")
          ls -l dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # A tag that PEP 440 calls a pre-release, such as v0.4.6rc1 or
        # v0.5.0.dev1, is marked as a pre-release. GitHub's "latest release"
        # skips those, so self-update and the releases page keep pointing at
        # the last full release. packaging decides, as it does for uv and pip.
        run: |
          prerelease=$(uv run python -c 'import os; from packaging.version import Version; print(Version(os.environ["GITHUB_REF_NAME"]).is_prerelease)')
          flags=()
          if [[ "$prerelease" == True ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" --generate-notes "${flags[@]}" dist/*

  # Publishes the Linux and macOS binaries to PyPI as wheels, so that
  # `uv tool install herd-cli` gives the command `herd`. PyPI has no tag for
  # the BSDs, so tools/build-wheels.py skips them. This uses trusted
  # publishing: the project on PyPI must name this repository, this workflow
  # and the environment `pypi`. There is no token.
  pypi:
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-26.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: binaries
          path: dist
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Build wheels
        env:
          HERD_VERSION: ${{ github.ref_name }}
        run: uv run python tools/build-wheels.py
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/wheels
