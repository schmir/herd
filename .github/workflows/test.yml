name: test

on:
  push:
    # A tag is tested by the release workflow, which calls this one.
    branches: ["**"]
  # A pull request from a fork is not a push to this repository, so without
  # this nothing would run on one.
  pull_request:
  # Called by the release workflow, which publishes the binaries built here.
  workflow_call:

permissions:
  contents: read

env:
  # A tag build bakes its own tag into the binary. Anything else is not a
  # release, and says so when asked for its version.
  HERD_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}

jobs:
  # The suites in test/ load herd's modules into Janet, so they test the
  # sources rather than a binary, and one platform is enough.
  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      # The ci shell rather than the default one: the editor tooling in that
      # shell is built from source, and none of it is needed to run the
      # tests. Fetch its packages in a step of their own, so that the nix
      # output stays out of the log of the tests.
      - name: Set up the ci shell
        id: ci
        run: |
          zig=$(nix develop .#ci --command zig version)
          echo "zig=$zig" >> "$GITHUB_OUTPUT"
      # just test links build/herd with zig, so the zig cache of the build job
      # below helps here too. Only restored: this job links one target, and a
      # cache it saved under the same key would lack the others.
      - uses: actions/cache/restore@v6
        with:
          path: ~/.cache/zig
          key: zig-${{ steps.ci.outputs.zig }}-${{ hashFiles('tools/gen-ninja.janet') }}
          restore-keys: zig-${{ steps.ci.outputs.zig }}-
      - name: Run tests
        run: nix develop .#ci --command just test

  # What a shell prints for an unknown command differs from one to the next,
  # so the command-line tests run once for each shell standing in as sh. The
  # Linux binary from the build job is enough, since only the shell varies.
  test-cli-shells:
    needs: build
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: actions/download-artifact@v8
        with:
          name: binaries
          path: bin
      # Fetch the ci shell's packages in a step of their own, so that the nix
      # output stays out of the log of the tests.
      - name: Set up the ci shell
        run: nix develop .#ci --command true
      - name: Run the command-line tests with each shell
        run: |
          # Artifacts do not keep the executable bit.
          chmod +x bin/linux-x86_64/herd
          nix develop .#ci --command just test-cli-shells bin/linux-x86_64/herd

  # One job builds every platform: zig cc cross-compiles the image jpm writes
  # into build/herd.c, so no build has to run on the machine it targets.
  # Running on every push means a change to jpm, spork, the pinned Janet or
  # zig breaks here rather than while a tag is being cut.
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Set up the ci shell
        id: ci
        run: |
          zig=$(nix develop .#ci --command zig version)
          echo "zig=$zig" >> "$GITHUB_OUTPUT"
      # zig builds libc and compiler-rt for each target the first time it
      # links for it, which is most of the time a cross-compile takes. The
      # targets are in tools/gen-ninja.janet. A change there starts from the
      # last cache of the same zig and saves a new one, so that a new target
      # is kept. herd's own sources do not go into the cache, so it does not
      # grow from one commit to the next.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/zig
          key: zig-${{ steps.ci.outputs.zig }}-${{ hashFiles('tools/gen-ninja.janet') }}
          restore-keys: zig-${{ steps.ci.outputs.zig }}-
      - name: Cross-compile
        run: nix develop .#ci --command just dist

      # One artifact for all platforms. It keeps the layout of dist/, with
      # PLATFORM/herd for each platform. GitHub has no BSD runners, so the
      # check job below does not run those, and the release publishes them
      # unchecked.
      - uses: actions/upload-artifact@v7
        with:
          name: binaries
          path: dist/*/herd
          if-no-files-found: error

  # A cross-compiled binary has run nowhere yet, so each one runs the
  # command-line tests on the platform it is for. This is what tests herd on
  # macOS, on ARM64 and on musl. The BSD binaries have no runner to go to.
  check:
    name: check-${{ matrix.platform }}
    needs: build
    runs-on: ${{ matrix.runner }}
    env:
      HERD: ${{ github.workspace }}/bin/${{ matrix.platform }}/herd
    strategy:
      fail-fast: false
      matrix:
        # jp is the release binary of jp 0.2.1, the version the dev shells
        # use, pinned by the hash jp-checksums.sha256.asc gives for it. jj is
        # the release archive of jj 0.46.0, the version the dev shells use,
        # pinned by the digest GitHub lists for it.
        include:
          - runner: ubuntu-26.04
            platform: linux-x86_64
            jp: jp-linux-amd64
            jp-sha256: f3c5d4cd38a971d9c1666555deb208f080b62708b89d0f5f615e4ae605a0cb8e
            jj: x86_64-unknown-linux-musl
            jj-sha256: fce0271158e665ceb82dc66c5eb95b1728649094e9133074f3b5baece345fc08
          - runner: ubuntu-26.04-arm
            platform: linux-aarch64
            jp: jp-linux-arm64
            jp-sha256: eba658170bfbcad1b5a49c0b087ce153544575e082f77b049de3563f0c5dd536
            jj: aarch64-unknown-linux-musl
            jj-sha256: 80e28f7501c11e50e0ca06cd6a1fa1d982cff9cc59bfe4411a9d36aa501d867e
          - runner: macos-15
            platform: macos-arm64
            jp: jp-darwin-arm64
            jp-sha256: 2c11cb17f376273cb0066d0f27533c1bdc4f4b64891205b826f3bf0a6a4d3324
            jj: aarch64-apple-darwin
            jj-sha256: 43daa37ce0f9716cdf6fb65a29cbcae74a3160aef048cf3cb3d166d41cb4ab58
          - runner: macos-15-intel
            platform: macos-x86_64
            jp: jp-darwin-amd64
            jp-sha256: ca1ec721273a578f2747e413342b26cc01656648fafc1f6436d935043b4d2cbe
            jj: x86_64-apple-darwin
            jj-sha256: 10d941de276c7c5074ef5d395312813b4575f4ce92cb9c0b05738efb90bd3b60
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: actions/download-artifact@v8
        with:
          name: binaries
          path: bin

      - name: Check the binary runs
        run: |
          # Artifacts do not keep the executable bit.
          chmod +x "$HERD"
          file "$HERD"
          case "${{ matrix.platform }}" in
            # The runner is glibc; a musl binary running here is the
            # portability claim under test.
            linux-*) file "$HERD" | grep -q 'statically linked' ;;
            # Apple silicon runs nothing unsigned, so zig signs ad hoc for
            # arm64. An Intel Mac runs unsigned code, and zig leaves it so.
            macos-arm64) codesign --verify "$HERD" ;;
          esac
          # Asking for the version also proves the build baked one in.
          test "$("$HERD" --version)" = "herd $HERD_VERSION"

      # The filter tests skip themselves without jp, which the runner lacks.
      - name: Install jp
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          jp="$RUNNER_TEMP/bin/jp"
          curl -fsSL -o "$jp" \
            "https://github.com/jmespath/jp/releases/download/0.2.1/${{ matrix.jp }}"
          echo "${{ matrix.jp-sha256 }}  $jp" | shasum -a 256 -c -
          chmod +x "$jp"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # The jj tests skip themselves without jj, which the runner lacks.
      - name: Install jj
        run: |
          archive="jj-v0.46.0-${{ matrix.jj }}.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/jj-vcs/jj/releases/download/v0.46.0/$archive"
          echo "${{ matrix.jj-sha256 }}  $RUNNER_TEMP/$archive" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/bin" ./jj

      # The prysk version pyproject.toml names.
      - name: Run the command-line tests
        run: uv run prysk test/cli/
