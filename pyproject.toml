# Tracks the tools the tests run with. herd itself is not a Python project,
# and nothing here builds or installs code.

[project]
name = "herd-tests"
dynamic = ["version"]
requires-python = ">=3.10"
dependencies = ["packaging==26.3", "prysk==0.20.0"]
classifiers = [
  "Private :: Do Not Upload", # Prevent uploads to PyPI
]

[tool.uv]
package = false
